name: Refresh README showcase

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'README*.md'
      - '*/README*.md'
      - 'assets/thumbs/**'
      - 'scripts/**'
      - 'data/showcase.json'
      - 'data/engagement-links.json'
      - '.github/workflows/refresh-showcase.yml'

permissions:
  contents: write

concurrency:
  group: readme-showcase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install renderer and fonts
        run: |
          python -m pip install -r scripts/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk
      - name: Check ranking and fallback behavior
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh cross-platform heat and render showcase
        env:
          GITHUB_TOKEN: ${{ github.token }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/refresh_showcase.py --refresh
      - name: Build all languages and Contents
        run: python scripts/build_readmes.py
      - name: Validate localized navigation
        run: python scripts/validate_readmes.py
      - name: Commit updated showcase
        run: |
          git add 'README*.md' '*/README*.md' assets/showcase.gif assets/showcase.webp data/showcase.json
          if [ -d assets/showcase-previews ]; then
            git add assets/showcase-previews
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh README showcase and cross-platform heat'
          git push
