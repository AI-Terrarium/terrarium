name: Synchronize reviewed catalog
run-name: Catalog ${{ inputs.batch_id }}

on:
  workflow_dispatch:
    inputs:
      hf_revision:
        description: Published Hugging Face commit
        required: true
        type: string
      batch_id:
        description: Platform synchronization batch
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: readme-showcase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install catalog renderer
        run: python -m pip install -r scripts/requirements.txt
      - name: Check catalog contract
        run: python -m unittest discover -s scripts -p 'test_catalog_sync.py'
      - name: Synchronize the published batch
        env:
          HF_REVISION: ${{ inputs.hf_revision }}
          BATCH_ID: ${{ inputs.batch_id }}
        run: python scripts/sync_public_catalog.py --hf-revision "$HF_REVISION" --batch-id "$BATCH_ID"
      - name: Build and validate localized catalog
        run: |
          python scripts/build_readmes.py
          python scripts/validate_readmes.py
      - name: Commit catalog and receipt
        run: |
          git add 'README*.md' '*/README*.md' docs/i18n
          git add data/catalog.jsonl data/catalog-sync-baseline.jsonl data/catalog-sync.json data/archive-index.jsonl data/platform-metrics.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize reviewed catalog and receipt'
          git push
